  Built from Claude Design's handoff (design_handoff_coming_soon/README.md,

  The design links fonts.googleapis.com. That is the one thing changed without

    <!--
      THE QUESTION FORM IS DELIBERATELY NOT HERE YET.

      House Counsel ruled on it, 2026-08-24 (LEGAL-REGISTER items 59-66): the
      static half of this page may ship today; the form ships once three things
      exist. Not paperwork — each one is a promise this page would otherwise
      make and break:

        59  A PUBLISHED PRIVACY NOTICE at a real URL. Art. 13 information is
            owed at the MOMENT the data is obtained — on this page, before
            submit, not on a thank-you screen.
        60  A NAMED CONTROLLER, which is Elias personally until the company is
            incorporated, with a contact address that actually receives mail.
            The domain has no MX record, and a notice printing a bouncing
            address is worse than one printing none.
        61  A NAMED SENDER for the reply, because whatever sends it is a
            recipient of the stranger's enquiry under Art. 13(1)(e).

      Also decided, for when it does ship: "email me when it opens" is consent
      for ONE email and the address is deleted once it is sent; a question
      asker's address may never be reused to announce the launch; Instagram is
      not email with a different shape; and the no-reply path must say "we
      won't reply" rather than "anonymous", because the platform still logs an
      IP and the question text routinely identifies its author.

      So the invitation is absent rather than dishonest. It returns whole.
    -->
